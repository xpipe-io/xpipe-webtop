name: Docker Push

on:
  push:
    branches: [ "main" ]

jobs:
  test-image:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[stage]')
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set variables
        run: |
          XPIPE_PACKAGE=${{ contains(github.event.head_commit.message, '[release]') == true && 'xpipe' || 'xpipe-ptb' }}
          echo "XPIPE_PACKAGE=$XPIPE_PACKAGE" >> $GITHUB_ENV
      - name: Setup buildx
        uses: docker/setup-buildx-action@v1
      - name: Build
        run: |
          docker build -t xpipe-webtop-test .
          docker run --rm -it -u abc --entrypoint bash xpipe-webtop-test /apps/test.sh

